# Gradle settings for CI, appended to ~/.gradle/gradle.properties by .github/actions/setup-gradle-build, where they win
# over the project's gradle.properties. Tuned for GitHub's standard runner for public repositories: 4 vCPUs, 16 GB
# RAM, one Gradle invocation per job.

# Daemon heap with room left for four test JVMs (1 GB heap each, see novila.android.unittest), lint, AAPT2 and the OS.
# ParallelGC: throughput over pause times (Android's build guide). Metaspace capped and heap dumps on OOM, as the
# guide asks whenever jvmargs are set (gradle#19750). SoftRefLRUPolicyMSPerMB=1 lets Gradle's soft-referenced caches
# go early instead of filling the heap (as Now in Android). A larger JIT code cache so compilation never stops when
# it fills up.
org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g -XX:ReservedCodeCacheSize=256m -XX:SoftRefLRUPolicyMSPerMB=1 -XX:+UseParallelGC -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
# Max workers stays at Gradle's default, one per CPU (4). Never set it to 2 or less while on Gradle 9.8: with Isolated
# Projects it freezes when max workers <= the builds in the tree (the root build and build-logic), gradle#39040.
# One build per machine: watching the file system between builds is pure overhead.
org.gradle.vfs.watch=false

# Kotlin compiles inside the Gradle daemon: no second JVM to start and warm up, and no second heap to size.
kotlin.compiler.execution.strategy=in-process
# Incremental compilation only pays off on the next build in the same checkout, which CI never has. Without it the
# compiler skips writing its caches. Unchanged modules still come from the build cache.
kotlin.incremental=false

# Compose compiler stability reports, uploaded by the Tests job. Set for every CI build so compile tasks have the
# same inputs everywhere and share build cache entries.
novila.composeReports=true
