name: Push recorded screenshots
description: >-
  Commits the Roborazzi screenshots a failed verifyAndRecord run wrote to the PR branch, where they show up in the PR
  diff for review, comments on the PR and starts the given workflows on the new commit (pushes by GITHUB_TOKEN trigger
  nothing). The job checked out the PR merged into main, so the images move over to the branch's newest commit first.
  Used by ci.yml (the phone) and wear.yml (the watch); either may push first, so a rejected push retries on the new tip.
inputs:
  token:
    description: github.token, with contents, pull-requests and actions write.
    required: true
  workflows:
    description: Space-separated workflow files to start on the pushed commit.
    required: true
runs:
  using: composite
  steps:
    - name: Commit, push and start CI
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        WORKFLOWS: ${{ inputs.workflows }}
        BRANCH: ${{ github.event.pull_request.head.ref }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
      run: |
        screenshots=':(glob)**/src/test/screenshots/**'
        git add -A -- "$screenshots"
        if git diff --cached --quiet; then
          exit 0
        fi
        git diff --cached --name-only -z --diff-filter=AM | tar --null -T - -cf "$RUNNER_TEMP/screenshots.tar"
        git reset -q --hard

        auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        pushed=""
        for attempt in 1 2 3; do
          git -c "http.https://github.com/.extraheader=$auth" fetch -q --no-tags origin "refs/heads/$BRANCH"
          git checkout -q --force --detach FETCH_HEAD
          tar -xf "$RUNNER_TEMP/screenshots.tar"
          git add -A -- "$screenshots"
          if git diff --cached --quiet; then
            exit 0
          fi
          changed=$(git diff --cached --name-only | wc -l)
          git commit -q -m "Record screenshot references" -m "$(git diff --cached --name-only | sed 's/^/- /')"
          if git -c "http.https://github.com/.extraheader=$auth" push -q origin "HEAD:refs/heads/$BRANCH"; then
            pushed=1
            break
          fi
          sleep $((attempt * 5))
        done
        if [ -z "$pushed" ]; then
          echo "::error title=Screenshots not pushed::The branch kept moving; comment /record-screenshots on the PR."
          exit 1
        fi
        for workflow in $WORKFLOWS; do
          gh workflow run "$workflow" --ref "$BRANCH"
        done

        run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
        body="Recorded $changed changed screenshot(s) and pushed them to this branch. Check them in the diff; CI is running on the new commit. ([run]($run_url))"
        gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" -f body="$body" > /dev/null
        echo "::notice title=Screenshots recorded::Pushed $changed screenshot(s) to $BRANCH, CI restarts on that commit"
