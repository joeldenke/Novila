name: Set up Gradle build
description: >-
  JDK 21, Gradle with setup-gradle's caching, and the CI Gradle properties. setup-gradle restores the closest Gradle
  User Home (dependencies, transforms and the build cache, so unchanged modules aren't rebuilt) per job, falling back
  to the newest entry when build files changed. Runs on main save; PR runs restore what main saved.
inputs:
  cache-encryption-key:
    description: >-
      secrets.GRADLE_ENCRYPTION_KEY (openssl rand -base64 16). With it setup-gradle also caches the configuration
      cache, so CI skips configuration when build files didn't change. Optional.
    required: false
    default: ""
runs:
  using: composite
  steps:
    - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
      with:
        distribution: temurin
        java-version: 21

    # Default (enhanced) caching: restore keys per job, cleanup of unused files and deduplication.
    - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      with:
        cache-encryption-key: ${{ inputs.cache-encryption-key }}

    # After setup-gradle, so nothing it writes to the Gradle User Home replaces them.
    - name: CI Gradle properties
      shell: bash
      run: |
        mkdir -p ~/.gradle
        cat "$GITHUB_ACTION_PATH/../../ci-gradle.properties" >> ~/.gradle/gradle.properties
