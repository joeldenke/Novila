# Checks that the build stays compatible with Gradle Isolated Projects: configures every module
# with it on (dry run, nothing is built). Real builds keep it off: it is experimental in Gradle 9.x
# and full AGP support comes with AGP 10.
#
# Manual only (Actions tab → Isolated Projects → Run workflow): the dry run is slow and has hung
# for over 20 minutes on AGP 9.x, so it never runs on its own. Run it after changing build logic.
name: Isolated Projects

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: isolated-projects-${{ github.ref }}
  cancel-in-progress: true

jobs:
  isolated-projects:
    name: Isolated Projects compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-gradle-build
      - name: Configure all modules with Isolated Projects
        run: |
          set -o pipefail
          ./gradlew assembleDebug --dry-run -Dorg.gradle.unsafe.isolated-projects=true 2>&1 | tee build.log
      - name: Annotate failures
        if: failure()
        uses: ./.github/actions/annotate-gradle-failures
