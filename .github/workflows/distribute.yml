# Builds the app and sends it to testers via Firebase App Distribution
# when a PR is merged to main (or when run manually from the Actions tab).
#
# Authenticates to Google Cloud with Workload Identity Federation: no JSON key is stored.
# scripts/bootstrap-firebase.sh creates everything and sets these Actions variables:
#   FIREBASE_APP_ID                 e.g. 1:1234567890:android:abc123 (for se.novila.debug)
#   FIREBASE_TESTER_GROUPS          Firebase group alias(es), e.g. "testare"
#   GCP_WORKLOAD_IDENTITY_PROVIDER  projects/<number>/locations/global/workloadIdentityPools/github/providers/novila
#   GCP_SERVICE_ACCOUNT             github-distribute@<project>.iam.gserviceaccount.com
name: Distribute to testers

on:
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Never run two distributions at once; queue them instead of cancelling.
concurrency:
  group: distribute
  cancel-in-progress: false

env:
  FIREBASE_TOOLS_VERSION: 15.33.0

jobs:
  distribute:
    name: Build and distribute
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: firebase
    permissions:
      contents: read
      id-token: write # lets the job request a GitHub OIDC token for Workload Identity Federation
    steps:
      - name: Check configuration
        env:
          APP_ID: ${{ vars.FIREBASE_APP_ID }}
          GROUPS: ${{ vars.FIREBASE_TESTER_GROUPS }}
          PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          SA: ${{ vars.GCP_SERVICE_ACCOUNT }}
        run: |
          missing=0
          [ -n "$APP_ID" ]   || { echo "::error::Variable FIREBASE_APP_ID is missing"; missing=1; }
          [ -n "$GROUPS" ]   || { echo "::error::Variable FIREBASE_TESTER_GROUPS is missing"; missing=1; }
          [ -n "$PROVIDER" ] || { echo "::error::Variable GCP_WORKLOAD_IDENTITY_PROVIDER is missing"; missing=1; }
          [ -n "$SA" ]       || { echo "::error::Variable GCP_SERVICE_ACCOUNT is missing"; missing=1; }
          [ "$missing" = 0 ] || echo "::error::Run scripts/bootstrap-firebase.sh to create them."
          exit $missing

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
          persist-credentials: false

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic

      - name: Build APK
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: ./gradlew assembleDebug --stacktrace

      - name: Write release notes
        # The PR title goes through env, never inline in the script (prevents script injection).
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          SHA: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
        run: |
          if [ -n "$PR_NUMBER" ]; then
            printf 'PR #%s: %s\n' "$PR_NUMBER" "$PR_TITLE" > release-notes.txt
          else
            printf 'Manual build\n' > release-notes.txt
          fi
          printf 'Commit %s\n' "${SHA:0:7}" >> release-notes.txt
          cat release-notes.txt

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      # Exchanges the GitHub OIDC token for short-lived Google credentials and exports
      # GOOGLE_APPLICATION_CREDENTIALS, which firebase-tools picks up.
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Upload to Firebase App Distribution
        env:
          APP_ID: ${{ vars.FIREBASE_APP_ID }}
          GROUPS: ${{ vars.FIREBASE_TESTER_GROUPS }}
        run: |
          npx --yes "firebase-tools@${FIREBASE_TOOLS_VERSION}" appdistribution:distribute \
            app/build/outputs/apk/debug/app-debug.apk \
            --app "$APP_ID" \
            --groups "$GROUPS" \
            --release-notes-file release-notes.txt

      - name: Upload APK as build artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: novila-${{ github.run_number }}
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
