# Builds a signed release (R8) and sends it to testers via Firebase App Distribution
# when a PR is merged to main (or when run manually from the Actions tab).
#
# Requires, under repo Settings → Secrets and variables → Actions:
#   Secret   FIREBASE_SERVICE_ACCOUNT        JSON key for a service account with the
#                                            "Firebase App Distribution Admin" role
#   Secret   NOVILA_RELEASE_KEYSTORE_BASE64  base64 of the release keystore (.jks)
#   Secret   NOVILA_RELEASE_STORE_PASSWORD   keystore password
#   Secret   NOVILA_RELEASE_KEY_PASSWORD     key password
#   Variable NOVILA_RELEASE_KEY_ALIAS        key alias, e.g. "novila"
#   Variable FIREBASE_APP_ID                 e.g. 1:1234567890:android:abc123 (for se.novila)
#   Variable FIREBASE_TESTER_GROUPS          Firebase group alias(es), e.g. "testers"
name: Distribute to testers

on:
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Never run two distributions at once; queue them instead of cancelling.
concurrency:
  group: distribute
  cancel-in-progress: false

env:
  FIREBASE_TOOLS_VERSION: 15.33.0

jobs:
  distribute:
    name: Build and distribute
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: firebase
    steps:
      - name: Check configuration
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          NOVILA_RELEASE_KEYSTORE_BASE64: ${{ secrets.NOVILA_RELEASE_KEYSTORE_BASE64 }}
          NOVILA_RELEASE_STORE_PASSWORD: ${{ secrets.NOVILA_RELEASE_STORE_PASSWORD }}
          NOVILA_RELEASE_KEY_PASSWORD: ${{ secrets.NOVILA_RELEASE_KEY_PASSWORD }}
          NOVILA_RELEASE_KEY_ALIAS: ${{ vars.NOVILA_RELEASE_KEY_ALIAS }}
          FIREBASE_APP_ID: ${{ vars.FIREBASE_APP_ID }}
          FIREBASE_TESTER_GROUPS: ${{ vars.FIREBASE_TESTER_GROUPS }}
        run: |
          missing=0
          for name in FIREBASE_SERVICE_ACCOUNT NOVILA_RELEASE_KEYSTORE_BASE64 NOVILA_RELEASE_STORE_PASSWORD \
                      NOVILA_RELEASE_KEY_PASSWORD NOVILA_RELEASE_KEY_ALIAS FIREBASE_APP_ID FIREBASE_TESTER_GROUPS; do
            [ -n "${!name}" ] || { echo "::error title=Missing configuration::$name is not set"; missing=1; }
          done
          exit $missing

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
          persist-credentials: false

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.NOVILA_RELEASE_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          chmod 600 "$RUNNER_TEMP/release.jks"

      - name: Build signed release APK
        env:
          VERSION_CODE: ${{ github.run_number }}
          NOVILA_RELEASE_STORE_PASSWORD: ${{ secrets.NOVILA_RELEASE_STORE_PASSWORD }}
          NOVILA_RELEASE_KEY_PASSWORD: ${{ secrets.NOVILA_RELEASE_KEY_PASSWORD }}
          NOVILA_RELEASE_KEY_ALIAS: ${{ vars.NOVILA_RELEASE_KEY_ALIAS }}
        run: |
          set -o pipefail
          NOVILA_RELEASE_KEYSTORE="$RUNNER_TEMP/release.jks" ./gradlew assembleRelease 2>&1 | tee build.log

      - name: Verify APK signature
        run: |
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk | grep -i 'certificate'

      - name: Annotate failures
        if: failure()
        run: |
          [ -f build.log ] || exit 0
          { grep -E '^e: ' build.log; grep -A3 '^\* What went wrong' build.log | grep -vE '^\* What went wrong|^--$|^\s*$'; } \
            | grep -v '^> Task ' | awk '!seen[$0]++' | head -10 \
            | while IFS= read -r line; do echo "::error title=Gradle::${line}"; done || true

      - name: Write release notes
        # The PR title goes through env, never inline in the script (prevents script injection).
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          SHA: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
        run: |
          if [ -n "$PR_NUMBER" ]; then
            printf 'PR #%s: %s\n' "$PR_NUMBER" "$PR_TITLE" > release-notes.txt
          else
            printf 'Manual build\n' > release-notes.txt
          fi
          printf 'Commit %s\n' "${SHA:0:7}" >> release-notes.txt
          cat release-notes.txt

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Upload to Firebase App Distribution
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          APP_ID: ${{ vars.FIREBASE_APP_ID }}
          GROUPS: ${{ vars.FIREBASE_TESTER_GROUPS }}
        run: |
          creds="$RUNNER_TEMP/firebase-sa.json"
          printf '%s' "$SA" > "$creds"
          chmod 600 "$creds"
          export GOOGLE_APPLICATION_CREDENTIALS="$creds"
          npx --yes "firebase-tools@${FIREBASE_TOOLS_VERSION}" appdistribution:distribute \
            app/build/outputs/apk/release/app-release.apk \
            --app "$APP_ID" \
            --groups "$GROUPS" \
            --release-notes-file release-notes.txt
          rm -f "$creds"

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      # The R8 mapping file is needed to deobfuscate crash stack traces from this build.
      - name: Upload APK and R8 mapping
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: novila-${{ github.run_number }}
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/mapping/release/mapping.txt
          retention-days: 90
