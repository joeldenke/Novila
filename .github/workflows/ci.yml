# Runs on every PR to main as three parallel jobs, so the run takes as long as its slowest job. Each job restores
# the Gradle User Home that the last run on main saved (setup-gradle), so modules a PR doesn't touch come
# FROM-CACHE instead of being compiled and tested again.
#   - Format and lint: Spotless (ktlint) and Android lint over every module (:app:lintDebug with checkDependencies),
#     in one job so they share one setup.
#   - Tests: unit and screenshot tests and coverage. When the PR description contains /record-screenshots, changed
#     screenshots are recorded and pushed to the PR branch, and CI starts again on that commit.
#   - Build: the debug APK and its badging check.
# "Lint, test and build" collects them and is the required status check in branch protection, so nothing red can
# be merged. Release builds (R8, release signing) only run on merge to main, in distribute.yml.
name: CI

on:
  pull_request:
    branches: [main]
  # Runs on main save the Gradle cache that PR runs restore (PR runs may only read it).
  push:
    branches: [main]
  # Lets screenshots.yml start CI on the commit it pushes (pushes by GITHUB_TOKEN trigger nothing).
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Format and lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-gradle-build
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
      # :app:lintDebug checks the app and every module it depends on together (checkDependencies), which is what
      # unused resources need. :core:googlehealth isn't part of the app yet, so it is linted on its own.
      - name: Spotless (ktlint) and Android lint
        run: |
          set -o pipefail
          ./gradlew spotlessCheck :app:lintDebug :core:googlehealth:lint --continue 2>&1 | tee build.log
      - name: Annotate failures
        if: failure()
        uses: ./.github/actions/annotate-gradle-failures
      - name: Upload lint reports on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lint-reports
          path: "**/build/reports/lint-results-*"
          retention-days: 7

  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # push recorded screenshots to the PR branch
      pull-requests: write # say so on the PR
      actions: write # start CI on the pushed commit
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-gradle-build
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
      # Unit tests of every module (debug variant only, see build-logic), screenshot tests against the committed
      # references and coverage per module. verifyAndRecord fails on a changed screenshot like verify, and also
      # writes the new image to src/test/screenshots. Main runs it too, so its cache entries fit PR runs.
      - name: Unit and screenshot tests, coverage
        run: |
          set -o pipefail
          ./gradlew test verifyAndRecordRoborazziDebug koverXmlReportCoverage --continue 2>&1 | tee build.log

      - name: Coverage summary
        if: success()
        run: |
          python3 - >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import glob, xml.etree.ElementTree as ET
          reports = sorted(glob.glob("**/build/reports/kover/report*.xml", recursive=True))
          if not reports:
              print("::warning title=Coverage::No Kover XML report found")
              raise SystemExit
          totals = {}
          rows = []
          for path in reports:
              module = ":" + path.split("/build/")[0].replace("/", ":")
              counters = {c.get("type"): c for c in ET.parse(path).getroot().findall("counter")}
              line = counters.get("LINE")
              if line is None:
                  continue
              covered, missed = int(line.get("covered")), int(line.get("missed"))
              rows.append((module, covered, covered + missed))
              for kind, c in counters.items():
                  t = totals.setdefault(kind, [0, 0])
                  t[0] += int(c.get("covered")); t[1] += int(c.get("missed"))
          print("### Coverage (unit tests, all modules)\n\n| Metric | Covered |\n|---|---|")
          for kind in ("LINE", "BRANCH", "INSTRUCTION"):
              covered, missed = totals.get(kind, [0, 0])
              total = covered + missed
              print(f"| {kind.title()} | {100 * covered / total:.1f}% ({covered}/{total}) |" if total else f"| {kind.title()} | n/a |")
          print("\n<details><summary>Lines per module</summary>\n\n| Module | Lines |\n|---|---|")
          for module, covered, total in rows:
              print(f"| `{module}` | {100 * covered / total:.0f}% ({covered}/{total}) |" if total else f"| `{module}` | n/a |")
          print("\n</details>")
          PY

      # Stability and skippability of every composable. See the jetpack-compose-performance skill.
      - name: Upload Compose compiler reports and coverage
        if: success()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: compose-reports
          path: |
            **/build/compose-reports/
            **/build/reports/kover/
          retention-days: 14

      - name: Annotate failures
        if: failure()
        uses: ./.github/actions/annotate-gradle-failures

      # Commits the screenshots recorded above to the PR branch, where they show up in the PR diff for review, and
      # starts CI on that commit (pushes by GITHUB_TOKEN trigger nothing). Only when the PR description says the UI
      # changes on purpose (/record-screenshots), otherwise a changed screenshot just fails. Only for PRs from this
      # repository: a fork's token can't push, and the run started here is a workflow_dispatch, so it never records
      # again.
      # The job checked out the PR merged into main, so the images move over to the PR head before the commit.
      - name: Push recorded screenshots
        if: >-
          failure() && github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          contains(github.event.pull_request.body, '/record-screenshots')
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          screenshots=':(glob)**/src/test/screenshots/**'
          git add -A -- "$screenshots"
          if git diff --cached --quiet; then
            exit 0
          fi
          git diff --cached --name-only -z --diff-filter=AM | tar --null -T - -cf "$RUNNER_TEMP/screenshots.tar"
          git reset -q --hard

          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=$auth" fetch -q --no-tags origin "$HEAD_SHA"
          git checkout -q --detach FETCH_HEAD
          tar -xf "$RUNNER_TEMP/screenshots.tar"
          git add -A -- "$screenshots"
          if git diff --cached --quiet; then
            exit 0
          fi
          changed=$(git diff --cached --name-only | wc -l)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "Record screenshot references" -m "$(git diff --cached --name-only | sed 's/^/- /')"
          git -c "http.https://github.com/.extraheader=$auth" push -q origin "HEAD:refs/heads/$BRANCH"
          gh workflow run ci.yml --ref "$BRANCH"

          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          body="Recorded $changed changed screenshot(s) and pushed them to this branch. Check them in the diff; CI is running on the new commit. ([run]($run_url))"
          gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" -f body="$body" > /dev/null
          echo "::notice title=Screenshots recorded::Pushed $changed screenshot(s) to $BRANCH, CI restarts on that commit"

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports
          path: |
            **/build/reports/tests/
            **/build/test-results/
            **/build/outputs/roborazzi/
          retention-days: 7


  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-gradle-build
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
      # Badging: permissions, SDK levels, features, exported components and queries of the APK testers
      # get, compared with the reviewed app/badging/debug-badging.txt. A library or manifest change
      # that adds any of these fails here until the file is updated in the PR. See Badging.kt.
      - name: Debug build and badging check
        run: |
          set -o pipefail
          ./gradlew :app:assembleDebug :app:checkDebugBadging --console=plain 2>&1 | tee build.log
      # Compares the badging on its own, after the Gradle check: the job fails on any difference between the APK and
      # the reviewed file, even if the Gradle task didn't run or compared the wrong thing. Each added permission is
      # shown with the library or manifest it came from (the manifest merger's report), so the PR says why it's there.
      - name: Badging diff
        if: always() && hashFiles('app/build/outputs/badging/debug-badging.txt') != ''
        run: |
          generated=app/build/outputs/badging/debug-badging.txt
          golden=app/badging/debug-badging.txt
          report=app/build/outputs/logs/manifest-merger-debug-report.txt
          # How Gradle ran the check (executed, up to date, skipped), for when the two disagree.
          check=$(grep -E '^> Task :app:checkDebugBadging' build.log || echo "not in build.log")
          echo "::notice title=checkDebugBadging::$check"
          # TEMPORARY diagnosis: how the APK's manifest and package were made, and what the APK declares.
          tasks=$(grep -E '^> Task :app:(processDebugMainManifest|processDebugManifest|mergeDebugResources|packageDebug|generateDebugBadging|assembleDebug)' build.log | sed -e ':a' -e 'N' -e '$!ba' -e 's/\n/%0A/g')
          echo "::notice title=App tasks::$tasks"
          manifest=$(find app/build/intermediates -name AndroidManifest.xml -path '*merged_manifest*debug*' | head -1)
          echo "::notice title=Merged manifest::$manifest has POST_NOTIFICATIONS: $(grep -c POST_NOTIFICATIONS "$manifest" || true)"
          apk=$(find app/build/outputs/apk/debug -name '*.apk' | head -1)
          aapt2=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)aapt2
          perms=$("$aapt2" dump permissions "$apk" | sed -e ':a' -e 'N' -e '$!ba' -e 's/\n/%0A/g')
          echo "::notice title=APK permissions ($apk, $(stat -c %y "$apk"))::$perms"
          echo "::notice title=Generated badging head::$(head -12 "$generated" | sed -e ':a' -e 'N' -e '$!ba' -e 's/\n/%0A/g')"
          [ -f "$golden" ] || golden=/dev/null
          diff=$(diff -u "$golden" "$generated" | tail -n +3 | grep -E '^[+-]' || true)
          [ -n "$diff" ] || exit 0
          origins=""
          for permission in $(printf '%s\n' "$diff" | sed -n "s/^+uses-permission: name='\([^']*\)'.*/\1/p"); do
            origin=$(grep -A1 -F "uses-permission#$permission" "$report" 2>/dev/null | sed -n 's/.*ADDED from //p' | head -1)
            origins+="$permission: ${origin:-unknown}"$'\n'
          done
          {
            echo "### Badging changed"
            echo
            echo "Review the lines below. If the change is intended, comment \`/record-badging\` on the PR."
            echo
            echo '```diff'
            echo "$diff"
            echo '```'
            if [ -n "$origins" ]; then
              echo
              echo "Where the new permissions come from:"
              echo
              echo '```'
              printf '%s' "$origins"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          # One annotation each for the diff and the origins, readable in the PR without opening the log.
          encode() { printf '%s' "$1" | sed -e 's/%/%25/g' | sed -e ':a' -e 'N' -e '$!ba' -e 's/\n/%0A/g'; }
          echo "::error title=Badging changed (comment /record-badging if intended)::$(encode "$diff")"
          [ -z "$origins" ] || echo "::notice title=Where the new permissions come from::$(encode "$origins")"
          exit 1

      - name: Upload badging on failure
        if: failure() && hashFiles('app/build/outputs/badging/debug-badging.txt') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: badging
          path: app/build/outputs/badging/
          retention-days: 7
      - name: Annotate failures
        if: failure()
        uses: ./.github/actions/annotate-gradle-failures

  # The single required check: green only when every job above is green.
  check:
    name: Lint, test and build
    if: always()
    needs: [lint, test, build]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: All jobs passed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          failed=$(jq -r 'to_entries[] | select(.value.result != "success") | "\(.key): \(.value.result)"' <<<"$RESULTS")
          if [ -n "$failed" ]; then
            while IFS= read -r line; do echo "::error title=CI job not green::$line"; done <<<"$failed"
            exit 1
          fi
