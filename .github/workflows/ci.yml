# Runs on every PR to main: formatting, lint, unit and screenshot tests, coverage and a debug build,
# as parallel jobs. "Lint, test and build" collects them and is the required status check in branch
# protection, so nothing red can be merged.
# Release builds (R8, release signing) only run on merge to main, in distribute.yml.
# Isolated Projects compatibility has its own workflow, isolated-projects.yml.
name: CI

on:
  pull_request:
    branches: [main]
  # Runs on main write the Gradle cache that PR runs restore (PR runs may only read it).
  push:
    branches: [main]
  # Lets screenshots.yml start CI on the commit it pushes (pushes by GITHUB_TOKEN trigger nothing).
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-gradle-build
      - name: Spotless (ktlint)
        run: |
          set -o pipefail
          ./gradlew spotlessCheck 2>&1 | tee build.log
      - name: Annotate failures
        if: failure()
        uses: ./.github/actions/annotate-gradle-failures

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-gradle-build
      - name: Android lint
        run: |
          set -o pipefail
          ./gradlew lintDebug --continue 2>&1 | tee build.log
      - name: Annotate failures
        if: failure()
        uses: ./.github/actions/annotate-gradle-failures
      - name: Upload lint reports on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lint-reports
          path: "**/build/reports/lint-results-*"
          retention-days: 7

  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-gradle-build
      - name: Unit and screenshot tests, coverage
        run: |
          set -o pipefail
          # Screenshot tests compare against committed references once they exist.
          screenshots=""
          if git ls-files -- '*/src/test/screenshots/*.png' | grep -q .; then
            screenshots=verifyRoborazziDebug
          else
            echo "::notice title=No reference screenshots::Comment /record-screenshots on the PR to record them."
          fi
          ./gradlew testDebugUnitTest $screenshots :app:koverXmlReportDebug -Pnovila.composeReports=true \
            --continue 2>&1 | tee build.log

      - name: Coverage summary
        if: success()
        run: |
          python3 - >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import glob, xml.etree.ElementTree as ET
          reports = glob.glob("app/build/reports/kover/*.xml")
          if not reports:
              print("::warning title=Coverage::No Kover XML report found")
              raise SystemExit
          counters = {c.get("type"): c for c in ET.parse(reports[0]).getroot().findall("counter")}
          print("### Coverage (app + core modules, debug unit tests)\n\n| Metric | Covered |\n|---|---|")
          for kind in ("LINE", "BRANCH", "INSTRUCTION"):
              c = counters.get(kind)
              if c is not None:
                  covered, missed = int(c.get("covered")), int(c.get("missed"))
                  total = covered + missed
                  print(f"| {kind.title()} | {100 * covered / total:.1f}% ({covered}/{total}) |" if total else f"| {kind.title()} | n/a |")
          PY

      # Stability and skippability of every composable. See the jetpack-compose-performance skill.
      - name: Upload Compose compiler reports and coverage
        if: success()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: compose-reports
          path: |
            **/build/compose-reports/
            app/build/reports/kover/
          retention-days: 14

      - name: Annotate failures
        if: failure()
        uses: ./.github/actions/annotate-gradle-failures

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports
          path: |
            **/build/reports/tests/
            **/build/test-results/
            **/build/outputs/roborazzi/
          retention-days: 7

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-gradle-build
      - name: Debug build
        run: |
          set -o pipefail
          ./gradlew assembleDebug 2>&1 | tee build.log
      - name: Annotate failures
        if: failure()
        uses: ./.github/actions/annotate-gradle-failures

  # The single required check: green only when every job above is green.
  check:
    name: Lint, test and build
    if: always()
    needs: [format, lint, test, build]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: All jobs passed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          failed=$(jq -r 'to_entries[] | select(.value.result != "success") | "\(.key): \(.value.result)"' <<<"$RESULTS")
          if [ -n "$failed" ]; then
            while IFS= read -r line; do echo "::error title=CI job not green::$line"; done <<<"$failed"
            exit 1
          fi
