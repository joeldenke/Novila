version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      androidx-och-compose:
        patterns: ["androidx.*"]
      kotlin-och-agp:
        patterns: ["org.jetbrains.kotlin*", "com.android.*"]
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    # Workflows plus the local composite actions in .github/actions.
    directories: ["/", "/.github/actions/*"]
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]
