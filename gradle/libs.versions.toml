[versions]
agp = "9.4.0"
kotlin = "2.4.21"
composeBom = "2026.09.00"
# Material 3 1.5 (beta) ahead of the BOM, for the expressive and adaptive components the
# design system builds on (flexible app bars, button groups, unified bottom sheet state).
material3 = "1.5.0-beta01"
androidxCore = "1.19.1"
androidxActivity = "1.13.0"
androidxLifecycle = "2.11.0"
navigation3 = "1.2.0"
# Local storage for the days and the coach's answers, see PreferencesStore.
# 1.3.0-rc01 brings transparent encryption of the files (datastore-tink).
datastore = "1.3.0-rc01"
# Tink, the encryption library DataStore's serializer builds on. Pinned to the version datastore-tink
# 1.3.0-rc01 depends on, so the API used here and the transitive one cannot drift apart.
tink = "1.20.0"
# Metro: compile-time dependency injection (Kotlin compiler plugin). Must support the Kotlin version above,
# see https://zacsweers.github.io/metro/latest/compatibility/.
metro = "1.4.5"
# Reminders: one-time work per reminder, kept across restarts by WorkManager. See ReminderScheduler.
work = "2.10.1"
# Health Connect: read-only steps and active calories, see HealthConnectSource.
healthConnect = "1.1.0"
# Home-screen widget (Glance), see NovilaWidget.
glance = "1.2.0"
# Open-source licenses: the plugin collects every shipped dependency into the app's raw resources,
# and the Compose screen in Settings shows them. See LicensesScreen.
aboutLibraries = "15.3.0"
kotlinxSerialization = "1.11.0"
kotlinxCoroutines = "1.11.0"
# Gemini Nano on the device through AICore, for the coach's message. See GeminiNanoCoachModel.
mlkitGenaiPrompt = "1.0.0-beta2"
# Automated backup and restore tests: device-side actions that seed and verify the data a backup
# carries. The app itself uses the platform Auto Backup rules (app/src/main/res/xml), because
# AndroidX has no backup implementation artifact; the actions are used by :core:data's tests. See
# docs/backup.md.
androidxTestBackup = "1.0.0-alpha02"
junit = "4.13.2"
robolectric = "4.17"
roborazzi = "1.76.0"
composablePreviewScanner = "0.9.3"
spotless = "8.10.4"
ktlint = "1.8.0"
kover = "0.9.11"

# Android platform
compileSdk = "37"
targetSdk = "37"
minSdk = "26"

[libraries]
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidxCore" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidxActivity" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "androidxLifecycle" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "androidxLifecycle" }
# A ViewModelStore per Navigation 3 entry, cleared when the entry leaves the back stack. See NavigationState.
androidx-lifecycle-viewmodel-navigation3 = { module = "androidx.lifecycle:lifecycle-viewmodel-navigation3", version.ref = "androidxLifecycle" }
# ViewModels created by Metro (@ViewModelKey, metroViewModel()), see AppGraph.
metrox-viewmodel-compose = { module = "dev.zacsweers.metro:metrox-viewmodel-compose", version.ref = "metro" }

androidx-navigation3-runtime = { module = "androidx.navigation3:navigation3-runtime", version.ref = "navigation3" }
androidx-navigation3-ui = { module = "androidx.navigation3:navigation3-ui", version.ref = "navigation3" }
androidx-datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }
# Tink-backed serializers for DataStore: every preference file is sealed with a key from the Android
# Keystore. See EncryptingPreferencesSerializer in :core:data.
androidx-datastore-tink = { module = "androidx.datastore:datastore-tink", version.ref = "datastore" }
# Tink itself (Aead, AndroidKeysetManager, tests' AesGcmJce). datastore-tink depends on it; declared
# here so the types used in :core:data are on its compile classpath on purpose.
tink-android = { module = "com.google.crypto.tink:tink-android", version.ref = "tink" }
androidx-work-runtime = { module = "androidx.work:work-runtime", version.ref = "work" }
androidx-work-testing = { module = "androidx.work:work-testing", version.ref = "work" }
androidx-health-connect-client = { module = "androidx.health.connect:connect-client", version.ref = "healthConnect" }
androidx-glance-appwidget = { module = "androidx.glance:glance-appwidget", version.ref = "glance" }
# Novila's color schemes as the widget's colors, in :core:designsystem only (NovilaGlanceTheme).
androidx-glance-material3 = { module = "androidx.glance:glance-material3", version.ref = "glance" }
androidx-glance-appwidget-testing = { module = "androidx.glance:glance-appwidget-testing", version.ref = "glance" }
# The licenses list in Settings, in the app's own Material 3 theme (NovilaTheme wraps MaterialTheme).
aboutlibraries-compose-m3 = { module = "com.mikepenz:aboutlibraries-compose-m3", version.ref = "aboutLibraries" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinxCoroutines" }
kotlinx-serialization-core = { module = "org.jetbrains.kotlinx:kotlinx-serialization-core", version.ref = "kotlinxSerialization" }
# Google Health API responses (JSON), see GoogleHealthJson.
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerialization" }
# On-device Gemini Nano (ML Kit GenAI Prompt API), see GeminiNanoCoachModel.
mlkit-genai-prompt = { module = "com.google.mlkit:genai-prompt", version.ref = "mlkitGenaiPrompt" }
# Device-side actions for backup and restore tests, see docs/backup.md.
androidx-test-backup = { module = "androidx.test.backup:backup", version.ref = "androidxTestBackup" }

compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-material3 = { module = "androidx.compose.material3:material3", version.ref = "material3" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }

junit = { module = "junit:junit", version.ref = "junit" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }
roborazzi = { module = "io.github.takahirom.roborazzi:roborazzi", version.ref = "roborazzi" }
roborazzi-compose = { module = "io.github.takahirom.roborazzi:roborazzi-compose", version.ref = "roborazzi" }
roborazzi-junit-rule = { module = "io.github.takahirom.roborazzi:roborazzi-junit-rule", version.ref = "roborazzi" }
roborazzi-compose-preview-scanner-support = { module = "io.github.takahirom.roborazzi:roborazzi-compose-preview-scanner-support", version.ref = "roborazzi" }
composable-preview-scanner = { module = "io.github.sergio-sastre.ComposablePreviewScanner:android", version.ref = "composablePreviewScanner" }

# AGP 9 ships built-in Kotlin with KGP 2.2.10 as the floor. A newer KGP goes on the
# buildscript classpath (per AGP 9 release notes) and must match compose-compiler.
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
# Compile-time API for the convention plugins in build-logic. Only the public gradle-api
# artifact, never AGP internals: AGP 10 plans to expose nothing else for compilation.
android-gradle-api = { module = "com.android.tools.build:gradle-api", version.ref = "agp" }
compose-gradle-plugin = { module = "org.jetbrains.kotlin:compose-compiler-gradle-plugin", version.ref = "kotlin" }
# Kover's DSL, for the coverage variant every module shares (build-logic Kover.kt).
kover-gradle-plugin = { module = "org.jetbrains.kotlinx:kover-gradle-plugin", version.ref = "kover" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
roborazzi = { id = "io.github.takahirom.roborazzi", version.ref = "roborazzi" }
kover = { id = "org.jetbrains.kotlinx.kover", version.ref = "kover" }
metro = { id = "dev.zacsweers.metro", version.ref = "metro" }
# The Android variant writes aboutlibraries.json into the app's raw resources from its full runtime classpath.
aboutlibraries-android = { id = "com.mikepenz.aboutlibraries.plugin.android", version.ref = "aboutLibraries" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }

# Convention plugins from build-logic (no version: they come from the included build).
novila-android-application = { id = "novila.android.application" }
novila-android-library = { id = "novila.android.library" }
novila-android-feature = { id = "novila.android.feature" }
novila-android-compose = { id = "novila.android.compose" }
novila-android-unittest = { id = "novila.android.unittest" }
novila-android-screenshot = { id = "novila.android.screenshot" }
novila-jvm-library = { id = "novila.jvm.library" }
