[versions]
agp = "9.4.0"
kotlin = "2.4.21"
composeBom = "2026.09.00"
# Material 3 1.5 (beta) ahead of the BOM, for the expressive and adaptive components the
# design system builds on (flexible app bars, button groups, unified bottom sheet state).
material3 = "1.5.0-beta01"
androidxCore = "1.19.1"
androidxActivity = "1.13.0"
androidxLifecycle = "2.11.0"
navigation3 = "1.2.0"
# Health Connect: read-only steps and active calories, see HealthConnectSource.
healthConnect = "1.1.0"
kotlinxSerialization = "1.11.0"
junit = "4.13.2"
robolectric = "4.17"
roborazzi = "1.76.0"
composablePreviewScanner = "0.9.3"
spotless = "8.10.4"
ktlint = "1.8.0"
kover = "0.9.11"

# Android platform
compileSdk = "37"
targetSdk = "37"
minSdk = "26"

[libraries]
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidxCore" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidxActivity" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "androidxLifecycle" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "androidxLifecycle" }

androidx-navigation3-runtime = { module = "androidx.navigation3:navigation3-runtime", version.ref = "navigation3" }
androidx-navigation3-ui = { module = "androidx.navigation3:navigation3-ui", version.ref = "navigation3" }
androidx-health-connect-client = { module = "androidx.health.connect:connect-client", version.ref = "healthConnect" }
kotlinx-serialization-core = { module = "org.jetbrains.kotlinx:kotlinx-serialization-core", version.ref = "kotlinxSerialization" }
# Google Health API responses (JSON), see GoogleHealthJson.
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerialization" }

compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-material3 = { module = "androidx.compose.material3:material3", version.ref = "material3" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }

junit = { module = "junit:junit", version.ref = "junit" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }
roborazzi = { module = "io.github.takahirom.roborazzi:roborazzi", version.ref = "roborazzi" }
roborazzi-compose = { module = "io.github.takahirom.roborazzi:roborazzi-compose", version.ref = "roborazzi" }
roborazzi-junit-rule = { module = "io.github.takahirom.roborazzi:roborazzi-junit-rule", version.ref = "roborazzi" }
roborazzi-compose-preview-scanner-support = { module = "io.github.takahirom.roborazzi:roborazzi-compose-preview-scanner-support", version.ref = "roborazzi" }
composable-preview-scanner = { module = "io.github.sergio-sastre.ComposablePreviewScanner:android", version.ref = "composablePreviewScanner" }

# AGP 9 ships built-in Kotlin with KGP 2.2.10 as the floor. A newer KGP goes on the
# buildscript classpath (per AGP 9 release notes) and must match compose-compiler.
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
# Compile-time API for the convention plugins in build-logic. Only the public gradle-api
# artifact, never AGP internals: AGP 10 plans to expose nothing else for compilation.
android-gradle-api = { module = "com.android.tools.build:gradle-api", version.ref = "agp" }
compose-gradle-plugin = { module = "org.jetbrains.kotlin:compose-compiler-gradle-plugin", version.ref = "kotlin" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
roborazzi = { id = "io.github.takahirom.roborazzi", version.ref = "roborazzi" }
kover = { id = "org.jetbrains.kotlinx.kover", version.ref = "kover" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }

# Convention plugins from build-logic (no version: they come from the included build).
novila-android-application = { id = "novila.android.application" }
novila-android-library = { id = "novila.android.library" }
novila-android-compose = { id = "novila.android.compose" }
novila-android-unittest = { id = "novila.android.unittest" }
novila-android-screenshot = { id = "novila.android.screenshot" }
