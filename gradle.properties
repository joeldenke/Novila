# --- Gradle performance ---
# CI overrides some of these for its 2-vCPU runners: .github/ci-gradle.properties.
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -XX:ReservedCodeCacheSize=256m -XX:SoftRefLRUPolicyMSPerMB=1 -XX:+UseParallelGC -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=fail
# Stores and loads the configuration cache in parallel, one project per thread (the build is Isolated Projects safe).
org.gradle.configuration-cache.parallel=true

# --- Kotlin ---
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=1g -XX:SoftRefLRUPolicyMSPerMB=1 -XX:+UseParallelGC

# --- Android ---
# useAndroidX and nonTransitiveRClass are defaults in AGP 9.
