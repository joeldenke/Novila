# --- Gradle performance ---
# CI overrides some of these for its 2-vCPU runners: .github/ci-gradle.properties.
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -XX:ReservedCodeCacheSize=256m -XX:SoftRefLRUPolicyMSPerMB=1 -XX:+UseParallelGC -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=fail
# Stores and loads the configuration cache in parallel, one project per thread.
org.gradle.configuration-cache.parallel=true
# Isolated Projects: modules are configured in parallel and only see each other through Gradle's isolated API.
# Any build logic that reaches into another project fails the build, so it can't creep back in.
org.gradle.isolated-projects=true
# KSP reads other projects' task dependencies unless told to stay isolated (google/ksp#2844). No module uses KSP yet
# (Metro is a compiler plugin), but the flag is set so a KSP library never breaks Isolated Projects. Keep it.
ksp.project.isolation.enabled=true

# --- Kotlin ---
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=1g -XX:SoftRefLRUPolicyMSPerMB=1 -XX:+UseParallelGC

# --- Android ---
# useAndroidX and nonTransitiveRClass are defaults in AGP 9.
